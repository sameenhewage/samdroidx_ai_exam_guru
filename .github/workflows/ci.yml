name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL 18 client and shellcheck
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint="$(gpg --show-keys --with-colons \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18 shellcheck
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          version: 0.11.26
      - name: Install backend dependencies
        run: uv sync --project apps/api --frozen
      - name: Check backup and restore operations
        env:
          REQUIRE_SHELLCHECK: "1"
        run: bash scripts/ops/check_backup_restore.sh
      - name: Lint backend
        run: uv run --project apps/api ruff check apps/api
      - name: Check backend formatting
        run: uv run --project apps/api ruff format --check apps/api
      - name: Type-check backend
        run: uv run --directory apps/api mypy
      - name: Test backend and integrations
        run: uv run --directory apps/api pytest tests -m "not backup_restore" --cov=exam_guru_api --cov-report=term-missing
      - name: Test bounded backup and restore integration
        timeout-minutes: 8
        run: uv run --directory apps/api pytest tests/integration/test_backup_restore_postgres.py -m backup_restore
      - name: Verify OpenAPI export
        run: uv run --project apps/api exam-guru-openapi packages/api-client/openapi.json && git diff --exit-code -- packages/api-client/openapi.json
      - name: Scan committed files for secrets
        run: git ls-files -z | xargs -0 uv run --project apps/api detect-secrets-hook --baseline .secrets.baseline

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 24.19.0
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
      - name: Verify generated client
        run: npm run generate --prefix packages/api-client && git diff --exit-code -- packages/api-client/src/schema.d.ts
      - name: Lint frontend
        run: npm run lint --prefix apps/web
      - name: Type-check frontend and client
        run: npm run typecheck
      - name: Test frontend
        run: npm run test:coverage --prefix apps/web
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build --prefix apps/web

  runtime:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 24.19.0
      - name: Install E2E dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start runtime
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify API, web, and maintenance scheduler
        run: curl --fail --silent http://localhost:8000/api/v1/health/ready && curl --fail --silent http://localhost:3000/ > /dev/null && docker compose ps --status running --services | grep --fixed-strings --line-regexp maintenance
      - name: Run admin browser E2E
        run: npm run test:e2e --prefix apps/web
      - name: Inspect runtime
        run: docker compose ps
      - name: Stop runtime
        if: always()
        run: docker compose down --volumes --remove-orphans
