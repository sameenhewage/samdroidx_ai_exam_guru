name: ai-exam-guru

x-api-environment: &api-environment
  EXAM_GURU_ENVIRONMENT: ${EXAM_GURU_ENVIRONMENT:-local}
  EXAM_GURU_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-exam_guru}:${POSTGRES_PASSWORD:-exam-guru-local-db}@postgres:5432/${POSTGRES_DB:-exam_guru}
  EXAM_GURU_VALKEY_URL: redis://valkey:6379/0
  EXAM_GURU_STORAGE_BACKEND: ${EXAM_GURU_STORAGE_BACKEND:-local}
  EXAM_GURU_STORAGE_ROOT: /data
  EXAM_GURU_MAX_UPLOAD_BYTES: ${EXAM_GURU_MAX_UPLOAD_BYTES:-268435456}
  EXAM_GURU_OBJECT_STORAGE_ENDPOINT_URL: ${EXAM_GURU_OBJECT_STORAGE_ENDPOINT_URL:-}
  EXAM_GURU_OBJECT_STORAGE_ACCESS_KEY: ${EXAM_GURU_OBJECT_STORAGE_ACCESS_KEY:-}
  EXAM_GURU_OBJECT_STORAGE_SECRET_KEY: ${EXAM_GURU_OBJECT_STORAGE_SECRET_KEY:-}
  EXAM_GURU_OBJECT_STORAGE_BUCKET: ${EXAM_GURU_OBJECT_STORAGE_BUCKET:-}
  EXAM_GURU_OBJECT_STORAGE_REGION: ${EXAM_GURU_OBJECT_STORAGE_REGION:-}
  EXAM_GURU_STORAGE_RECONCILIATION_INTERVAL_SECONDS: ${EXAM_GURU_STORAGE_RECONCILIATION_INTERVAL_SECONDS:-3600}
  EXAM_GURU_STORAGE_RECONCILIATION_GRACE_SECONDS: ${EXAM_GURU_STORAGE_RECONCILIATION_GRACE_SECONDS:-86400}
  EXAM_GURU_STORAGE_RECONCILIATION_MAX_OBJECTS_PER_RUN: ${EXAM_GURU_STORAGE_RECONCILIATION_MAX_OBJECTS_PER_RUN:-1000}
  EXAM_GURU_STORAGE_RECONCILIATION_APPLY_TAGS: ${EXAM_GURU_STORAGE_RECONCILIATION_APPLY_TAGS:-false}
  EXAM_GURU_IDENTITY_PROVIDER: deterministic
  EXAM_GURU_DETERMINISTIC_ADMIN_TOKEN: ${DETERMINISTIC_ADMIN_TOKEN:-exam-guru-admin-local-token}
  EXAM_GURU_DETERMINISTIC_REVIEWER_TOKEN: ${DETERMINISTIC_REVIEWER_TOKEN:-exam-guru-reviewer-local-token}
  EXAM_GURU_RATE_LIMITS_ENABLED: ${EXAM_GURU_RATE_LIMITS_ENABLED:-true}
  EXAM_GURU_RATE_LIMIT_WINDOW_SECONDS: ${EXAM_GURU_RATE_LIMIT_WINDOW_SECONDS:-60}
  EXAM_GURU_RATE_LIMIT_SOURCE_UPLOAD: ${EXAM_GURU_RATE_LIMIT_SOURCE_UPLOAD:-30}
  EXAM_GURU_RATE_LIMIT_EXTRACTION_TRIGGER: ${EXAM_GURU_RATE_LIMIT_EXTRACTION_TRIGGER:-60}
  EXAM_GURU_RATE_LIMIT_EMBEDDING_JOB_CREATE: ${EXAM_GURU_RATE_LIMIT_EMBEDDING_JOB_CREATE:-30}
  EXAM_GURU_RATE_LIMIT_RETRIEVAL_EXPLORE: ${EXAM_GURU_RATE_LIMIT_RETRIEVAL_EXPLORE:-30}
  EXAM_GURU_RATE_LIMIT_GENERATION_CREATE_RETRY: ${EXAM_GURU_RATE_LIMIT_GENERATION_CREATE_RETRY:-20}
  EXAM_GURU_RATE_LIMIT_VALIDATION_RUN: ${EXAM_GURU_RATE_LIMIT_VALIDATION_RUN:-60}
  EXAM_GURU_RATE_LIMIT_PAPER_PUBLISH_ARCHIVE: ${EXAM_GURU_RATE_LIMIT_PAPER_PUBLISH_ARCHIVE:-30}

x-ocr-worker-environment: &ocr-worker-environment
  EXAM_GURU_OCR_PROVIDER: ${EXAM_GURU_OCR_PROVIDER-tesseract}
  EXAM_GURU_OCR_TESSERACT_EXECUTABLE: ${EXAM_GURU_OCR_TESSERACT_EXECUTABLE:-tesseract}
  EXAM_GURU_OCR_TESSERACT_LANGUAGE: ${EXAM_GURU_OCR_TESSERACT_LANGUAGE:-sin+eng}
  EXAM_GURU_OCR_TESSERACT_MAX_SOURCE_BYTES: ${EXAM_GURU_OCR_TESSERACT_MAX_SOURCE_BYTES:-268435456}
  EXAM_GURU_OCR_TESSERACT_MAX_PAGES: ${EXAM_GURU_OCR_TESSERACT_MAX_PAGES:-40}
  EXAM_GURU_OCR_TESSERACT_DPI: ${EXAM_GURU_OCR_TESSERACT_DPI:-300}
  EXAM_GURU_OCR_TESSERACT_BATCH_SIZE: ${EXAM_GURU_OCR_TESSERACT_BATCH_SIZE:-4}
  EXAM_GURU_OCR_TESSERACT_TIMEOUT_SECONDS: ${EXAM_GURU_OCR_TESSERACT_TIMEOUT_SECONDS:-5}
  EXAM_GURU_OCR_TESSERACT_PAGE_SEGMENTATION_MODE: ${EXAM_GURU_OCR_TESSERACT_PAGE_SEGMENTATION_MODE:-3}
  EXAM_GURU_OCR_TESSERACT_MAX_PIXELS_PER_PAGE: ${EXAM_GURU_OCR_TESSERACT_MAX_PIXELS_PER_PAGE:-40000000}
  EXAM_GURU_OCR_TESSERACT_MAX_COMMAND_OUTPUT_BYTES: ${EXAM_GURU_OCR_TESSERACT_MAX_COMMAND_OUTPUT_BYTES:-8388608}

x-generation-provider-environment: &generation-provider-environment
  EXAM_GURU_GENERATION_PROVIDER: ${EXAM_GURU_GENERATION_PROVIDER:-}
  EXAM_GURU_GENERATION_OPENAI_API_KEY: ${EXAM_GURU_GENERATION_OPENAI_API_KEY:-}
  EXAM_GURU_GENERATION_MODEL: ${EXAM_GURU_GENERATION_MODEL:-}
  EXAM_GURU_GENERATION_MODEL_VERSION: ${EXAM_GURU_GENERATION_MODEL_VERSION:-}
  EXAM_GURU_GENERATION_PRICING_VERSION: ${EXAM_GURU_GENERATION_PRICING_VERSION:-}
  EXAM_GURU_GENERATION_INPUT_MICROUSD_PER_MILLION_TOKENS: ${EXAM_GURU_GENERATION_INPUT_MICROUSD_PER_MILLION_TOKENS:-}
  EXAM_GURU_GENERATION_OUTPUT_MICROUSD_PER_MILLION_TOKENS: ${EXAM_GURU_GENERATION_OUTPUT_MICROUSD_PER_MILLION_TOKENS:-}
  EXAM_GURU_GENERATION_TEMPERATURE: ${EXAM_GURU_GENERATION_TEMPERATURE:-}
  EXAM_GURU_GENERATION_TIMEOUT_MS: ${EXAM_GURU_GENERATION_TIMEOUT_MS:-}

x-semantic-verifier-environment: &semantic-verifier-environment
  EXAM_GURU_SEMANTIC_VERIFIER_PROVIDER: ${EXAM_GURU_SEMANTIC_VERIFIER_PROVIDER:-}
  EXAM_GURU_SEMANTIC_VERIFIER_OPENAI_API_KEY: ${EXAM_GURU_SEMANTIC_VERIFIER_OPENAI_API_KEY:-}
  EXAM_GURU_SEMANTIC_VERIFIER_MODEL: ${EXAM_GURU_SEMANTIC_VERIFIER_MODEL:-}
  EXAM_GURU_SEMANTIC_VERIFIER_MODEL_VERSION: ${EXAM_GURU_SEMANTIC_VERIFIER_MODEL_VERSION:-}
  EXAM_GURU_SEMANTIC_VERIFIER_PROMPT_VERSION: ${EXAM_GURU_SEMANTIC_VERIFIER_PROMPT_VERSION:-}
  EXAM_GURU_SEMANTIC_VERIFIER_PRICING_VERSION: ${EXAM_GURU_SEMANTIC_VERIFIER_PRICING_VERSION:-}
  EXAM_GURU_SEMANTIC_VERIFIER_INPUT_MICROUSD_PER_MILLION_TOKENS: ${EXAM_GURU_SEMANTIC_VERIFIER_INPUT_MICROUSD_PER_MILLION_TOKENS:-}
  EXAM_GURU_SEMANTIC_VERIFIER_OUTPUT_MICROUSD_PER_MILLION_TOKENS: ${EXAM_GURU_SEMANTIC_VERIFIER_OUTPUT_MICROUSD_PER_MILLION_TOKENS:-}
  EXAM_GURU_SEMANTIC_VERIFIER_TIMEOUT_MS: ${EXAM_GURU_SEMANTIC_VERIFIER_TIMEOUT_MS:-}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_GROUNDING_SOURCES: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_GROUNDING_SOURCES:-8}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_SOURCE_BYTES: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_SOURCE_BYTES:-8192}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_TOTAL_SOURCE_BYTES: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_TOTAL_SOURCE_BYTES:-32768}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_CANDIDATE_BYTES: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_CANDIDATE_BYTES:-32768}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_REQUEST_BYTES: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_REQUEST_BYTES:-65536}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_OUTPUT_TOKENS: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_OUTPUT_TOKENS:-512}
  EXAM_GURU_SEMANTIC_VERIFIER_MAX_COST_MICROUSD: ${EXAM_GURU_SEMANTIC_VERIFIER_MAX_COST_MICROUSD:-1000000}

x-embedding-provider-environment: &embedding-provider-environment
  EXAM_GURU_RETRIEVAL_EMBEDDING_PROVIDER: ${EXAM_GURU_RETRIEVAL_EMBEDDING_PROVIDER:-}
  EXAM_GURU_RETRIEVAL_EMBEDDING_MODEL: ${EXAM_GURU_RETRIEVAL_EMBEDDING_MODEL:-grade5-deterministic-shake256}
  EXAM_GURU_RETRIEVAL_EMBEDDING_DIMENSION: ${EXAM_GURU_RETRIEVAL_EMBEDDING_DIMENSION:-32}
  EXAM_GURU_RETRIEVAL_EMBEDDING_VERSION: ${EXAM_GURU_RETRIEVAL_EMBEDDING_VERSION:-v1}
  EXAM_GURU_RETRIEVAL_EMBEDDING_CONFIG_FINGERPRINT: ${EXAM_GURU_RETRIEVAL_EMBEDDING_CONFIG_FINGERPRINT:-sha256:51c1987251b1c8d373ecb6d476c2d00ae60da5173aa544a2ff4524a9141d3d89}
  EXAM_GURU_RETRIEVAL_EMBEDDING_OPENAI_API_KEY: ${EXAM_GURU_RETRIEVAL_EMBEDDING_OPENAI_API_KEY:-}
  EXAM_GURU_RETRIEVAL_EMBEDDING_PRICING_VERSION: ${EXAM_GURU_RETRIEVAL_EMBEDDING_PRICING_VERSION:-}
  EXAM_GURU_RETRIEVAL_EMBEDDING_INPUT_MICROUSD_PER_MILLION_TOKENS: ${EXAM_GURU_RETRIEVAL_EMBEDDING_INPUT_MICROUSD_PER_MILLION_TOKENS:-}
  EXAM_GURU_RETRIEVAL_EMBEDDING_TIMEOUT_MS: ${EXAM_GURU_RETRIEVAL_EMBEDDING_TIMEOUT_MS:-}

x-studio-storage: &studio-storage
  - type: bind
    source: ${EXAM_GURU_DATA_PATH:-./.exam-guru-data}
    target: /data

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_guru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam-guru-local-db}
      POSTGRES_USER: ${POSTGRES_USER:-exam_guru}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${VALKEY_PORT:-56379}:6379"
    volumes:
      - valkey-data:/data

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-exam-guru-local-secret}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-exam-guru-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-exam-guru-local-secret}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-exam-guru-local}
    entrypoint:
      - /bin/sh
      - -c
      - until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done; mc mb --ignore-existing local/exam-guru-sources

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-environment

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      <<: [*api-environment, *generation-provider-environment, *semantic-verifier-environment, *embedding-provider-environment]
    volumes: *studio-storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["dramatiq", "--processes", "1", "--threads", "4", "exam_guru_api.worker:broker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      <<: [*api-environment, *ocr-worker-environment, *generation-provider-environment, *semantic-verifier-environment, *embedding-provider-environment]
    volumes: *studio-storage

  maintenance:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["exam-guru-maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment: *api-environment
    volumes: *studio-storage
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        ADMIN_COOKIE_SECURE: "false"
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
        APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
        WEB_IDENTITY_PROVIDER: deterministic
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      DETERMINISTIC_ADMIN_TOKEN: ${DETERMINISTIC_ADMIN_TOKEN:-exam-guru-admin-local-token}
      DETERMINISTIC_REVIEWER_TOKEN: ${DETERMINISTIC_REVIEWER_TOKEN:-exam-guru-reviewer-local-token}
      ENABLE_DETERMINISTIC_IDENTITY: "true"
      ADMIN_COOKIE_SECURE: "false"
      WEB_IDENTITY_PROVIDER: deterministic
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  minio-data:
  postgres18-data:
  valkey-data:
